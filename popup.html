<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lassoft</title>
<style>
:root{--bg:#fff;--panel:#f5f6fb;--ink:#14161c;--muted:#5f6675;--line:#e4e6ef;--accent:#4f46e5;--accent2:#06b6d4;--on:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15171e;--panel:#1d2029;--ink:#eef0f6;--muted:#9aa1b2;--line:#2b2f3b;--accent:#818cf8;--accent2:#22d3ee;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{width:372px;max-height:600px;background:var(--bg);color:var(--ink);font:13.5px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
header img{width:30px;height:30px}
header h1{margin:0;font-size:17px;letter-spacing:-.015em}
header .s{margin-left:auto;font-size:11.5px;color:var(--muted)}
main{overflow:auto;padding:4px 16px 12px;display:grid;gap:14px}
h2{margin:0 0 6px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{display:grid;gap:3px;justify-items:start;padding:12px;border:0;border-radius:14px;text-align:left;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 10px 22px -14px var(--accent)}
.big.alt{background:var(--panel);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.big svg{width:22px;height:22px}.big b{font-size:14px}.big span{font-size:11.5px;opacity:.85}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.t{display:grid;justify-items:center;gap:5px;padding:10px 4px 8px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:11.5px;font-weight:600;text-align:center;line-height:1.2}
.t:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--bg))}
.t svg{width:22px;height:22px;color:var(--accent)}
.fx{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.f{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:12.5px;font-weight:600;text-align:left}
.f i{width:28px;height:16px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.15s}
.f i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.f[aria-pressed=true]{border-color:var(--accent)}.f[aria-pressed=true] i{background:var(--accent)}.f[aria-pressed=true] i::after{left:14px}
.recent{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.recent button{flex:none;width:96px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.recent img{display:block;width:100%;height:64px;object-fit:cover;object-position:top}
.recent span{display:block;padding:3px 6px;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;justify-content:space-between;align-items:center}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:12px;padding:0}
.note{padding:9px 11px;border-radius:10px;background:color-mix(in srgb,var(--accent) 8%,var(--bg));font-size:12.5px}
footer{display:flex;justify-content:space-between;gap:8px;padding:9px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
footer a{color:inherit}
kbd{font:600 10.5px ui-monospace,monospace;padding:1px 4px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--panel)}
</style>
</head>
<body>
<header><img src="icons/icon48.png" alt=""><h1>Lassoft</h1><span class="s" id="ver"></span></header>
<main>
  <div class="note" id="blocked" hidden>Chrome doesn’t let extensions work on this page. Open a normal website to use capture and extract tools. Recording still works.</div>
  <section class="hero">
    <button class="big" data-tool="area" title="Alt+Shift+A"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg><b>Capture area</b><span>Drag to select</span></button>
    <button class="big alt" data-tool="record"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="#ef4444" stroke="none"/></svg><b>Record</b><span>Tab, window or screen</span></button>
  </section>
  <section><h2>Capture</h2><div class="tools">
    <button class="t" data-tool="fullpage" title="Alt+Shift+F"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>Full page</button>
    <button class="t" data-tool="visible"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>Visible</button>
    <button class="t" data-tool="lasso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 21c0-2 1-3 3-3M5 15c-1.5-1.3-2-2.8-2-4.5C3 6.4 7 3 12 3s9 3.4 9 7.5S17 18 12 18c-1.2 0-2.4-.2-3.4-.6"/><circle cx="8" cy="17" r="2"/></svg>Lasso</button>
    <button class="t" data-tool="element"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4l7 17 2.5-7.5L21 11z"/></svg>Element</button>
  </div></section>
  <section><h2>Extract</h2><div class="tools">
    <button class="t" data-tool="scrape" title="Alt+Shift+E"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></svg>Scrape data</button>
    <button class="t" data-tool="pick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 3H5a2 2 0 0 0-2 2v4M15 3h4a2 2 0 0 1 2 2v4M3 15v4a2 2 0 0 0 2 2h4"/><path d="m13 13 8 3-3.5 1.5L16 21z"/></svg>Point &amp; pick</button>
    <button class="t" data-tool="media"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>Media &amp; files</button>
    <button class="t" data-tool="hidden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9M6.6 6.6C3.9 8.3 2 12 2 12s4 7 10 7c1.7 0 3.2-.5 4.5-1.2"/></svg>Hidden items</button>
  </div></section>
  <section><h2>Visual</h2><div class="tools">
    <button class="t" data-tool="inspect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>Fonts &amp; styles</button>
    <button class="t" data-tool="eyedropper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 22 1-1h3l9-9M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4z"/></svg>Pick colour</button>
    <button class="t" data-tool="palette"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 0 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.3A5.7 5.7 0 0 0 22 9.7C22 5.4 17.5 2 12 2z"/></svg>Page palette</button>
    <button class="t" data-tool="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>My captures</button>
  </div></section>
  <section><h2>Page effects</h2><div class="fx" id="fx">
    <button class="f" data-fx="halo" aria-pressed="false"><i></i>Cursor highlight</button>
    <button class="f" data-fx="ripple" aria-pressed="false"><i></i>Click ripples</button>
    <button class="f" data-fx="keys" aria-pressed="false"><i></i>Show keystrokes</button>
    <button class="f" data-fx="spot" aria-pressed="false"><i></i>Spotlight</button>
    <button class="f" data-fx="lens" aria-pressed="false"><i></i>Magnifier</button>
    <button class="f" data-fx="ruler" aria-pressed="false"><i></i>Reading ruler</button>
    <button class="f" data-fx="dark" aria-pressed="false"><i></i>Dark page</button>
    <button class="f" data-fx="gray" aria-pressed="false"><i></i>Grayscale</button>
    <button class="f" data-fx="xray" aria-pressed="false"><i></i>Layout outlines</button>
    <button class="f" data-fx="calm" aria-pressed="false"><i></i>Pause animations</button>
  </div></section>
  <section id="recentSec" hidden><div class="row"><h2>Recent captures</h2><button class="link" data-tool="library">See all</button></div><div class="recent" id="recent"></div></section>
</main>
<footer><span><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>A</kbd> area · <kbd>F</kbd> full page · <kbd>E</kbd> scrape</span><a href="https://github.com/suhaimizainalshah/Lassoft/blob/main/PRIVACY.md" target="_blank" rel="noopener">Privacy</a></footer>
<script src="popup.js"></script>
</body>
</html>
