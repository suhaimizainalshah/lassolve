<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lassoft capture</title>
<link rel="icon" href="icons/icon32.png">
<style>
:root{--bg:#f3f4f9;--panel:#fff;--ink:#14161c;--muted:#5f6675;--line:#e3e6ef;--soft:#eef0f6;--accent:#4f46e5;--accent2:#06b6d4;--stage:#e6e8f0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--panel:#1a1d24;--ink:#eef0f6;--muted:#9aa1b2;--line:#2b2f3b;--soft:#232733;--accent:#818cf8;--accent2:#22d3ee;--stage:#0c0e12;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-rows:auto 1fr}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;margin-right:6px;text-decoration:none;color:inherit}
.brand img{width:26px;height:26px}
.grp{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--soft)}
.tb{display:grid;place-items:center;width:36px;height:34px;border:0;border-radius:8px;background:transparent;color:var(--muted)}
.tb:hover{color:var(--ink);background:var(--panel)}
.tb[aria-pressed=true]{background:var(--panel);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tb svg{width:19px;height:19px}
.tb:disabled{opacity:.35;cursor:default}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);margin:5px 3px}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--accent)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-weight:650}
.btn:hover{background:var(--soft)}
.btn.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn svg{width:17px;height:17px}
select{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px}
.work{display:grid;grid-template-columns:1fr 250px;min-height:0}
.stage{position:relative;overflow:auto;background:var(--stage);display:grid;place-items:center;padding:24px}
#cv{display:block;box-shadow:0 20px 50px -24px rgba(0,0,0,.45);border-radius:6px;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/18px 18px;touch-action:none}
.side{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px;display:grid;gap:14px;align-content:start}
.side h2{margin:0;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.info{display:grid;gap:4px;font-size:13px}
.info a{color:var(--accent);overflow-wrap:anywhere}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lib button{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--soft);text-align:left}
.lib button[aria-current=true]{outline:2px solid var(--accent)}
.lib img{display:block;width:100%;height:70px;object-fit:cover;object-position:top}
.lib span{display:block;padding:3px 6px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txtin{position:absolute;min-width:120px;padding:2px 4px;border:2px dashed var(--accent);background:rgba(255,255,255,.85);color:#111;font:600 20px system-ui;outline:none;resize:none;overflow:hidden;white-space:pre}
.empty{display:grid;justify-items:center;gap:10px;text-align:center;padding:40px;max-width:540px}
.empty h1{margin:0;font-size:24px}
.empty p{margin:0;color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;width:100%;max-width:1100px;align-self:start}
.gallery .card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);display:grid}
.gallery .card button.open{padding:0;border:0;background:var(--soft)}
.gallery img{display:block;width:100%;height:150px;object-fit:cover;object-position:top}
.gallery .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;font-size:12.5px}
.gallery .meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.del{border:0;background:none;color:var(--muted);padding:4px;border-radius:6px}.del:hover{color:#dc2626;background:var(--soft)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,10px);opacity:0;padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;transition:.18s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
kbd{font:600 11px ui-monospace,monospace;padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--soft)}
@media (max-width:900px){.work{grid-template-columns:1fr}.side{display:none}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="editor.html"><img src="icons/icon48.png" alt="">Lassoft</a>
  <div class="grp" role="toolbar" aria-label="Tools" id="tools">
    <button class="tb" data-t="crop" title="Crop (C)" aria-label="Crop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"/></svg></button>
    <button class="tb" data-t="arrow" aria-pressed="true" title="Arrow (A)" aria-label="Arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19 19 5M10 5h9v9"/></svg></button>
    <button class="tb" data-t="rect" title="Rectangle (R)" aria-label="Rectangle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="14" rx="2"/></svg></button>
    <button class="tb" data-t="ellipse" title="Circle (O)" aria-label="Circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg></button>
    <button class="tb" data-t="pen" title="Pen (P)" aria-label="Pen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    <button class="tb" data-t="hl" title="Highlighter (H)" aria-label="Highlighter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m9 11-6 6v3h9l3-3M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg></button>
    <button class="tb" data-t="text" title="Text (T)" aria-label="Text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
    <button class="tb" data-t="num" title="Numbered step (N)" aria-label="Numbered step"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M11 9l2-1v8" stroke-linecap="round"/></svg></button>
    <button class="tb" data-t="blur" title="Blur to hide (B)" aria-label="Blur"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="4" height="4" opacity=".9"/><rect x="10" y="4" width="4" height="4" opacity=".5"/><rect x="16" y="4" width="4" height="4" opacity=".8"/><rect x="4" y="10" width="4" height="4" opacity=".4"/><rect x="10" y="10" width="4" height="4" opacity=".9"/><rect x="16" y="10" width="4" height="4" opacity=".3"/><rect x="4" y="16" width="4" height="4" opacity=".7"/><rect x="10" y="16" width="4" height="4" opacity=".3"/><rect x="16" y="16" width="4" height="4" opacity=".9"/></svg></button>
  </div>
  <div class="grp" id="colors" aria-label="Colour"></div>
  <select id="width" aria-label="Line width"><option value="3">Thin</option><option value="6" selected>Medium</option><option value="10">Thick</option></select>
  <div class="grp"><button class="tb" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button><button class="tb" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button></div>
  <span class="spacer"></span>
  <select id="fmt" aria-label="File format"><option value="png">PNG</option><option value="jpeg">JPG</option><option value="webp">WebP</option><option value="pdf">PDF, one page</option><option value="pdfa4">PDF, A4 pages</option></select>
  <button class="btn" id="copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>Copy</button>
  <button class="btn primary" id="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Download</button>
</header>
<div class="work">
  <main class="stage" id="stage"><canvas id="cv" aria-label="Your capture"></canvas></main>
  <aside class="side">
    <section class="info" id="info"></section>
    <section><h2>Shortcuts</h2><p style="margin:.4rem 0 0;font-size:12.5px;color:var(--muted);line-height:1.8"><kbd>A</kbd> arrow <kbd>R</kbd> box <kbd>T</kbd> text <kbd>N</kbd> step <kbd>B</kbd> blur <kbd>C</kbd> crop<br><kbd>Ctrl</kbd>+<kbd>C</kbd> copy <kbd>Ctrl</kbd>+<kbd>S</kbd> download<br>Choose PDF in the format menu for a document, or A4 pages to print.</p></section>
    <section><div style="display:flex;justify-content:space-between;align-items:center"><h2>My captures</h2><button class="del" id="delCur" title="Delete this capture">Delete</button></div><div class="lib" id="lib" style="margin-top:8px"></div></section>
  </aside>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="editor.js"></script>
</body>
</html>
